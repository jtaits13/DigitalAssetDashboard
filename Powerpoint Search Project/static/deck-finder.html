<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck finder</title>
  <style>
    :root {
      --bg: #f3f7fc;
      --bg-2: #eaf2fb;
      --ink: #20324a;
      --ink-strong: #13263f;
      --muted: #58718e;
      --accent: #2b67a4;
      --accent-2: #1f7fbc;
      --card: #ffffff;
      --card-2: #f7fbff;
      --stroke: rgba(86, 124, 168, 0.24);
      --ok: #1f8659;
      --danger: #b44646;
      --ring: rgba(43, 103, 164, 0.2);
      --shadow: 0 12px 26px rgba(24, 49, 81, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Outfit", "Segoe UI", Calibri, system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.45;
      min-height: 100vh;
      background:
        radial-gradient(circle at 0% 0%, rgba(43, 103, 164, 0.16) 0%, transparent 28%),
        radial-gradient(circle at 100% 12%, rgba(31, 127, 188, 0.09) 0%, transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 22px 20px 72px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 16px;
    }
    .brand .kicker {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 11px;
      color: #4d7399;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.55rem;
      color: var(--ink-strong);
      letter-spacing: -0.02em;
    }
    .lib-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.84rem;
    }
    .search-card {
      background: linear-gradient(180deg, var(--card), var(--card-2));
      border: 1px solid var(--stroke);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
    }
    .search-card:focus-within {
      border-color: rgba(77, 128, 184, 0.45);
      box-shadow: 0 0 0 3px rgba(52, 111, 171, 0.12), var(--shadow);
    }
    .search-wrap { position: relative; }
    .search-wrap::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 50%;
      width: 15px;
      height: 15px;
      border: 2px solid #5e84ab;
      border-radius: 50%;
      transform: translateY(-60%);
      pointer-events: none;
    }
    .search-wrap::after {
      content: "";
      position: absolute;
      left: 29px;
      top: calc(50% + 5px);
      width: 7px;
      height: 2px;
      background: #5e84ab;
      transform: rotate(45deg);
      pointer-events: none;
    }
    #q {
      width: 100%;
      font-family: inherit;
      font-size: 1.08rem;
      padding: 14px 16px 14px 44px;
      border: 1px solid rgba(95, 132, 176, 0.38);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
    }
    #q::placeholder { color: #7890aa; }
    .folder-input, select, input[type="date"] {
      font-family: inherit;
      font-size: 0.92rem;
      border: 1px solid rgba(95, 132, 176, 0.38);
      border-radius: 12px;
      padding: 9px 12px;
      background: #fff;
      color: var(--ink);
    }
    #q:focus, .folder-input:focus, select:focus, input[type="date"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }
    .hint {
      margin: 8px 2px 0;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin-top: 12px;
    }
    label.chk, label.field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #24486e;
    }
    .folder-input { min-width: min(100%, 420px); flex: 1; }
    .more-filters { display: none; }
    .more-filters.open { display: flex; }
    button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.02); }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ring); }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #1d5a96 0%, #2b7fbd 100%);
      border-color: rgba(12, 58, 100, 0.28);
      box-shadow: 0 4px 9px rgba(34, 68, 106, 0.11);
    }
    .btn-secondary {
      color: #19456f;
      background: #fff;
      border-color: rgba(80, 122, 172, 0.36);
    }
    .open-deck {
      color: #fff;
      background: linear-gradient(135deg, #1d5a96 0%, #2b7fbd 100%);
      border-color: rgba(12, 58, 100, 0.28);
      box-shadow: 0 4px 9px rgba(34, 68, 106, 0.11);
    }
    button.linkish, .lib-tools button {
      background: none;
      border: 0;
      color: var(--accent);
      padding: 0;
      box-shadow: none;
      font-weight: 700;
    }
    button.linkish:hover, .lib-tools button:hover {
      text-decoration: underline;
      transform: none;
      filter: none;
    }
    .setup {
      padding: 16px 18px;
      margin-bottom: 16px;
      border: 1px dashed rgba(95, 132, 176, 0.4);
      border-radius: 16px;
      background: rgba(246, 251, 255, 0.92);
    }
    .setup h2 { margin: 0 0 6px; font-size: 1.02rem; color: #244d76; }
    .setup p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
    .err { color: var(--danger); font-size: 0.9rem; margin-top: 8px; }
    .results-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin: 18px 2px 10px;
    }
    .results-head h2 {
      margin: 0;
      font-size: 0.95rem;
      color: #244d76;
    }
    .results-head .aside {
      color: var(--muted);
      font-size: 0.84rem;
    }
    .groups { display: grid; gap: 14px; }
    article.deck {
      background: linear-gradient(180deg, var(--card), var(--card-2));
      border: 1px solid var(--stroke);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px 16px 12px 18px;
      position: relative;
    }
    article.deck::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 4px;
      background: linear-gradient(180deg, #4f9ce9 0%, #78b8f4 100%);
    }
    .family {
      background: #eaf2fb;
      border: 1px solid rgba(86, 124, 168, 0.28);
      border-radius: 18px;
      padding: 6px;
      box-shadow: var(--shadow);
    }
    .family > article.deck {
      box-shadow: none;
      margin: 0;
    }
    .family-older {
      margin: 6px 6px 6px 22px;
      padding-left: 14px;
      border-left: 2px solid #9bb8d6;
      display: grid;
      gap: 8px;
    }
    .family-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #4d7399;
      padding: 2px 8px 6px 10px;
    }
    article.deck.older {
      background: #f7fbff;
      box-shadow: none;
      border-radius: 12px;
      padding: 11px 14px 10px 14px;
    }
    article.deck.older::before { display: none; }
    article.deck.older h3 { font-size: 0.98rem; color: #3d5d81; }
    .deck-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .deck-top h3 {
      margin: 0 0 3px;
      font-size: 1.05rem;
      color: #244d76;
    }
    .version-line {
      margin: 0 0 4px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #2b67a4;
    }
    .version-line.old { color: #7a5a20; }
    .meta-line {
      color: var(--muted);
      font-size: 0.82rem;
    }
    .actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
    ul.hits { list-style: none; margin: 10px 0 0; padding: 0; }
    ul.hits li { margin: 0 0 8px; }
    ul.hits li:last-child { margin-bottom: 0; }
    .slide-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      border: 1px solid var(--stroke);
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: none;
      font-weight: 500;
    }
    .slide-row:hover {
      border-color: rgba(43, 103, 164, 0.45);
      background: #f3f8ff;
      transform: none;
    }
    .slide-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .slide-title {
      margin: 2px 0 4px;
      font-weight: 700;
      color: var(--ink-strong);
    }
    .snippet { color: #3d5d81; font-size: 0.9rem; line-height: 1.4; }
    mark {
      background: #dcecff;
      color: var(--ink-strong);
      padding: 0 3px;
      border-radius: 4px;
      font-weight: 700;
    }
    .open-label {
      flex-shrink: 0;
      color: #19456f;
      background: linear-gradient(180deg, #eff6ff 0%, #e1eefb 100%);
      border: 1px solid rgba(80, 122, 172, 0.36);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      pointer-events: none;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 16px;
      border: 1px dashed rgba(95, 132, 176, 0.4);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.55);
    }
    .empty strong { color: #244d76; }
    @media (max-width: 720px) {
      .topbar, .deck-top, .slide-row, .results-head { flex-direction: column; }
      .actions { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="kicker">Internal slide library</div>
        <h1>Deck finder</h1>
      </div>
      <div class="lib-tools" id="libTools" hidden>
        <button class="linkish" id="changeFolder" type="button">Change folder</button>
        <button class="linkish" id="reindex" type="button">Refresh index</button>
      </div>
    </div>

    <div id="setup" class="setup" hidden>
      <h2>Connect your PowerPoint folder</h2>
      <p>Paste the folder path. Nothing is uploaded — this stays on the machine that is running the tool.</p>
      <div class="filters">
        <input class="folder-input" id="folderPath" type="text" placeholder="C:\Users\you\Decks">
        <button class="btn-primary" id="saveFolder" type="button">Save and index</button>
      </div>
      <div class="err" id="setupErr"></div>
    </div>

    <div class="search-card">
      <div class="search-wrap">
        <input id="q" type="search" placeholder="Describe the slide: BlackRock BUIDL AUM Q2" autocomplete="off" autofocus>
      </div>
      <p class="hint" id="searchHint">Use a few distinctive words from the email or the slide. Leave blank to browse decks.</p>
      <div class="filters">
        <label class="chk">
          <input id="latestOnly" type="checkbox" checked>
          Current versions only
        </label>
        <label class="field">Folder
          <select id="folderFilter"><option value="">All folders</option></select>
        </label>
        <button class="linkish" id="toggleMore" type="button">More filters</button>
      </div>
      <div class="filters more-filters" id="moreFilters">
        <label class="field">Modified after
          <input id="modifiedAfter" type="date">
        </label>
      </div>
    </div>

    <div class="results-head">
      <h2 id="resultLine">Not indexed yet</h2>
      <div class="aside" id="statusLine"></div>
    </div>
    <div class="err" id="pageErr"></div>
    <div id="results" class="groups"></div>
    <div id="empty" class="empty" hidden></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let debounceTimer = null;
    let status = null;

    function plural(n, word) {
      return n + " " + word + (n === 1 ? "" : "s");
    }

    function folderName(path) {
      if (!path) return "";
      const parts = String(path).replace(/\\/g, "/").split("/").filter(Boolean);
      return parts[parts.length - 1] || path;
    }

    async function api(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || res.statusText);
      }
      return data;
    }

    function fmtDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso.slice(0, 10);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function fillFolders(folders) {
      const sel = $("folderFilter");
      const current = sel.value;
      sel.innerHTML = '<option value="">All folders</option>';
      (folders || []).forEach((folder) => {
        const opt = document.createElement("option");
        opt.value = folder;
        opt.textContent = folder;
        sel.appendChild(opt);
      });
      if (current && (folders || []).includes(current)) sel.value = current;
    }

    async function refreshStatus() {
      status = await api("/api/status");
      const ready = status.configured;
      $("setup").hidden = ready;
      $("libTools").hidden = !ready;
      if (status.deck_folder) $("folderPath").value = status.deck_folder;
      fillFolders(status.folders || []);
      if (!ready) {
        $("statusLine").textContent = "";
        $("resultLine").textContent = "Connect a folder to begin";
        return;
      }
      const when = status.generated_at ? "Indexed " + fmtDate(status.generated_at) : "Not indexed yet";
      $("statusLine").textContent = when + " · " + folderName(status.deck_folder);
    }

    async function openDeck(relPath, slide) {
      $("pageErr").textContent = "";
      try {
        const body = { path: relPath };
        if (slide) body.slide = slide;
        await api("/api/open", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      } catch (err) {
        $("pageErr").textContent = err.message;
      }
    }

    function addSlideRow(ul, deck, hit, searching) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "slide-row";
      btn.innerHTML =
        "<div>" +
          '<div class="slide-kicker"></div>' +
          '<div class="slide-title"></div>' +
          (hit.snippet_html ? '<div class="snippet"></div>' : "") +
        "</div>" +
        '<span class="open-label"></span>';
      btn.querySelector(".slide-kicker").textContent = "Slide " + hit.number;
      btn.querySelector(".slide-title").textContent = hit.title || ("Slide " + hit.number);
      const snippet = btn.querySelector(".snippet");
      if (snippet) snippet.innerHTML = hit.snippet_html;
      btn.querySelector(".open-label").textContent = searching ? "Open this slide" : "Open slide " + hit.number;
      btn.addEventListener("click", () => openDeck(deck.rel_path, hit.number));
      li.appendChild(btn);
      ul.appendChild(li);
    }

    function versionCaption(deck, nested) {
      if (nested || !deck.is_latest) return "Older version";
      if ((deck.family_size || 1) > 1) return "Latest of " + deck.family_size + " versions";
      return "";
    }

    function renderDeckCard(group, searching, nested) {
      const deck = group.deck;
      const article = document.createElement("article");
      article.className = nested ? "deck older" : "deck";
      const caption = versionCaption(deck, nested);
      const folder = deck.folder ? deck.folder + " · " : "";
      const hits = group.hits || [];
      const previewSlides = (!searching && (deck.slides || [])) || [];

      article.innerHTML =
        '<div class="deck-top">' +
          "<div>" +
            "<h3></h3>" +
            (caption ? '<div class="version-line"></div>' : "") +
            '<div class="meta-line"></div>' +
          "</div>" +
          '<div class="actions">' +
            '<button class="open-deck" type="button">Open deck</button>' +
          "</div>" +
        "</div>";
      article.querySelector("h3").textContent = nested
        ? deck.filename
        : (deck.title || deck.filename);
      const versionEl = article.querySelector(".version-line");
      if (versionEl) {
        versionEl.textContent = caption;
        if (nested || !deck.is_latest) versionEl.classList.add("old");
      }
      article.querySelector(".meta-line").textContent =
        folder + (nested ? "" : deck.filename + " · ") +
        fmtDate(deck.modified || deck.fs_modified) +
        " · " + plural(deck.slide_count || 0, "slide");
      article.querySelector(".open-deck").addEventListener("click", () => openDeck(deck.rel_path));

      if (hits.length) {
        const ul = document.createElement("ul");
        ul.className = "hits";
        const shown = hits.slice(0, 8);
        shown.forEach((hit) => addSlideRow(ul, deck, hit, true));
        article.appendChild(ul);
        if (hits.length > shown.length) {
          const more = document.createElement("button");
          more.className = "linkish";
          more.type = "button";
          more.textContent = "Show " + (hits.length - shown.length) + " more matching slides";
          more.style.marginTop = "8px";
          more.addEventListener("click", () => {
            hits.slice(8).forEach((hit) => addSlideRow(ul, deck, hit, true));
            more.remove();
          });
          article.appendChild(more);
        }
      } else if (previewSlides.length && !nested) {
        const toggle = document.createElement("button");
        toggle.className = "linkish";
        toggle.type = "button";
        toggle.textContent = "Preview " + plural(previewSlides.length, "slide");
        toggle.style.marginTop = "10px";
        const ul = document.createElement("ul");
        ul.className = "hits";
        ul.hidden = true;
        previewSlides.forEach((slide) => addSlideRow(ul, deck, slide, false));
        toggle.addEventListener("click", () => {
          ul.hidden = !ul.hidden;
          toggle.textContent = ul.hidden
            ? "Preview " + plural(previewSlides.length, "slide")
            : "Hide slides";
        });
        article.appendChild(toggle);
        article.appendChild(ul);
      } else if (searching && !hits.length) {
        const p = document.createElement("p");
        p.className = "snippet";
        p.style.margin = "10px 0 0";
        p.textContent = nested
          ? "Older file in this version group."
          : "Matched the file name or folder, not a specific slide.";
        article.appendChild(p);
      }
      return article;
    }

    function renderGroups(data) {
      const root = $("results");
      root.innerHTML = "";
      const groups = data.groups || [];
      const q = ($("q").value || "").trim();
      const searching = Boolean(q);
      const latestOnly = $("latestOnly").checked;
      const deckCount = data.deck_hit_count || groups.length;
      const hiddenOlder = latestOnly && status && (status.deck_count || 0) > deckCount
        ? (status.deck_count - deckCount)
        : 0;

      $("empty").hidden = groups.length > 0;
      if (!groups.length) {
        $("resultLine").textContent = searching ? "No matching slides" : "No decks to show";
        $("empty").innerHTML = searching
          ? 'Nothing matched <strong></strong>. Try 2–4 distinctive words from the slide itself.'
          : "This folder has no indexed PowerPoint files yet. Refresh the index after adding decks.";
        if (searching) $("empty").querySelector("strong").textContent = q;
        return;
      }

      if (searching) {
        $("resultLine").textContent = plural(data.slide_hit_count || groups.length, "match") +
          " in " + plural(deckCount, "deck");
      } else {
        $("resultLine").textContent = "Browsing " + plural(deckCount, "deck");
      }
      if (hiddenOlder > 0) {
        $("resultLine").textContent += " · " + hiddenOlder + " older version" + (hiddenOlder === 1 ? "" : "s") + " hidden";
      }

      groups.forEach((group) => {
        const older = group.older || [];
        if (older.length) {
          const wrap = document.createElement("div");
          wrap.className = "family";
          const label = document.createElement("div");
          label.className = "family-label";
          label.textContent = (older.length + 1) + " versions of this deck";
          wrap.appendChild(label);
          wrap.appendChild(renderDeckCard(group, searching, false));
          const nest = document.createElement("div");
          nest.className = "family-older";
          older.forEach((item) => nest.appendChild(renderDeckCard(item, searching, true)));
          wrap.appendChild(nest);
          root.appendChild(wrap);
        } else {
          root.appendChild(renderDeckCard(group, searching, false));
        }
      });
    }

    async function runSearch() {
      $("pageErr").textContent = "";
      if (!status || !status.configured || !status.catalog_exists) {
        $("results").innerHTML = "";
        $("empty").hidden = true;
        return;
      }
      const params = new URLSearchParams({
        q: $("q").value.trim(),
        latest_only: $("latestOnly").checked ? "1" : "0",
        folder: $("folderFilter").value,
        modified_after: $("modifiedAfter").value,
      });
      try {
        const data = await api("/api/search?" + params.toString());
        fillFolders(data.folders || status.folders);
        renderGroups(data);
      } catch (err) {
        $("pageErr").textContent = err.message;
      }
    }

    function scheduleSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runSearch, 140);
    }

    $("q").addEventListener("input", scheduleSearch);
    $("latestOnly").addEventListener("change", runSearch);
    $("folderFilter").addEventListener("change", runSearch);
    $("modifiedAfter").addEventListener("change", runSearch);
    $("toggleMore").addEventListener("click", () => {
      const box = $("moreFilters");
      const open = box.classList.toggle("open");
      $("toggleMore").textContent = open ? "Fewer filters" : "More filters";
    });

    $("changeFolder").addEventListener("click", () => {
      $("setup").hidden = false;
      $("folderPath").focus();
    });

    async function reindexNow(errEl) {
      errEl.textContent = "";
      $("reindex").textContent = "Refreshing…";
      try {
        await api("/api/reindex", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        await refreshStatus();
        await runSearch();
      } catch (err) {
        errEl.textContent = err.message;
      } finally {
        $("reindex").textContent = "Refresh index";
      }
    }

    $("saveFolder").addEventListener("click", async () => {
      $("setupErr").textContent = "";
      try {
        await api("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deck_folder: $("folderPath").value.trim() }),
        });
        await reindexNow($("setupErr"));
        $("setup").hidden = true;
      } catch (err) {
        $("setupErr").textContent = err.message;
      }
    });

    $("reindex").addEventListener("click", () => reindexNow($("pageErr")));

    refreshStatus().then(runSearch).catch((err) => {
      $("pageErr").textContent = err.message;
    });
  </script>
</body>
</html>

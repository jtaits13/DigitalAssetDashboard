# Full data refresh for the static site: runs export pipelines, writes `static_home/data/*.json`, deploys.
# Schedule: four daily workflows (refresh-static-home-slot-*.yml) at 00:47, 06:47, 12:47, and 18:47 UTC.
# A single `*/6` cron was only finishing about twice a day. GitHub drops a delayed scheduled run once the
# next slot is due, which left snapshots 12–15 hours old and turned on the "may be outdated" banners.
# Each slot is its own workflow so a late start still runs (the next occurrence is 24 hours away).
# Use "Run workflow" here for a manual refresh.
name: Refresh static home data and deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore CoinGecko About blurb cache
        uses: actions/cache@v5
        with:
          path: static_home/data/crypto_about_blurbs_cache.json
          key: crypto-about-blurbs-v1-${{ hashFiles('coingecko_about.py') }}
          restore-keys: |
            crypto-about-blurbs-v1-

      - name: Restore Farside flow cache
        uses: actions/cache@v5
        with:
          path: static_home/data/farside_flow_cache.json
          key: farside-flow-cache-v1-${{ hashFiles('crypto_etps/flows.py') }}
          restore-keys: |
            farside-flow-cache-v1-

      - name: Export RSS + ETP + RWA + crypto JSON
        run: python scripts/export_static_site_data.py
        env:
          STOCKANALYSIS_USER_AGENT: ${{ secrets.STOCKANALYSIS_USER_AGENT }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_BLURB_FETCH_LIMIT: "15"

      - name: Validate static JSON bundle
        run: python scripts/validate_static_json.py

      - name: Commit refreshed JSON snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add the directory so gitignore skips cache files. A shell glob of
          # `*.json` includes ignored paths and makes `git add` exit 1.
          # rss_feed_overrides.json is tracked so 404 remaps survive the next refresh.
          git add -- "static_home/data/"
          git restore --staged -- \
            static_home/data/crypto_about_blurbs_cache.json \
            static_home/data/crypto_live_cache.json \
            static_home/data/etp_live_cache.json \
            2>/dev/null || true
          git status --short -- "static_home/data/"
          if git diff --cached --quiet; then
            echo "No JSON snapshot changes to commit"
          else
            git commit -m "Refresh GitHub Pages data snapshots."
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload static_home as site root
        uses: actions/upload-pages-artifact@v4
        with:
          path: static_home

      - name: Wait for Pages artifact to register
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

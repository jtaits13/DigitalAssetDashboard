# Fast GitHub Pages deploy: publishes committed files under `static_home/` as-is (no API export).
# Fresh JSON from RSS / ETP / RWA / CoinGecko is committed by `refresh-static-home-data.yml`
# so this push deploy cannot wipe home_news.json / rwa_onchain_home.json.
# Repo → Settings → Pages → Source → GitHub Actions.
name: Deploy static home to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "static_home/**"
      - "scripts/check_static_html_encoding.py"
      - "scripts/validate_static_json.py"
      - ".github/workflows/deploy-static-home.yml"
      - ".github/workflows/refresh-static-home-data.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static HTML text encoding
        run: python scripts/check_static_html_encoding.py

      - name: Validate committed static JSON (ETP + home snapshots)
        run: python scripts/validate_static_json.py

      - name: Upload static_home as site root
        uses: actions/upload-pages-artifact@v4
        with:
          path: static_home

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

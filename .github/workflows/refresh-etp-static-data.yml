# Partial static-site refresh: U.S. ETP JSON only (~2–4 min), then deploy.
# Does not re-export crypto, RWA, or news — those stay as committed until the full refresh workflow runs.
name: Refresh ETP static data and deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-etp-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Farside flow cache
        uses: actions/cache@v5
        with:
          path: static_home/data/farside_flow_cache.json
          key: farside-flow-cache-v1-${{ hashFiles('crypto_etps/flows.py') }}
          restore-keys: |
            farside-flow-cache-v1-

      - name: Export ETP JSON only
        run: python scripts/export_etp_static_data.py
        env:
          STOCKANALYSIS_USER_AGENT: ${{ secrets.STOCKANALYSIS_USER_AGENT }}

      - name: Validate ETP JSON bundle
        run: python scripts/validate_static_json.py

      - name: Commit refreshed ETP JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static_home/data/etps.json static_home/data/etp_kpis.json \
            static_home/data/aum_series.json static_home/data/etf_pulse.json \
            static_home/data/manifest.json static_home/data/farside_flow_cache.json
          if git diff --cached --quiet; then
            echo "No ETP JSON snapshot changes to commit"
          else
            git commit -m "Refresh GitHub Pages ETP data snapshots."
            git push
          fi

      - name: Upload static_home as site root
        uses: actions/upload-pages-artifact@v4
        with:
          path: static_home

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
